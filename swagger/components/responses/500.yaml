description: InternalServerError
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 500
        message:
          type: string
          example: Something went wrong
        data:
          type: string
          example: 'No such file or directory, open "/path/that/does/not/exist.txt"'
