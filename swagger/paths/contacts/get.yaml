tags:
  - Contacts
summary: Get all contacts
operationId: getAllContacts
description: Retrieve a list of contacts, optionally filtered by query parameters.
parameters:
  - in: query
    name: limit
    schema:
      type: integer
      default: 20
    description: Maximum number of contacts to return
  - in: query
    name: offset
    schema:
      type: integer
      default: 0
    description: Number of contacts to skip
security:
  - bearerAuth: []
responses:
  '200':
    description: List of contacts
    content:
      application/json:
        schema:
          type: array
          items:
            $ref: ../../components/schemas/contact.yaml
  '404':
    description: No contacts found
